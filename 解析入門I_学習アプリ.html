<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>解析入門I 学習アプリ（杉浦光夫）</title>
<style>
  :root{
    --bg:#14151c;
    --bg2:#1b1d28;
    --bg3:#232537;
    --border:#33364a;
    --text:#e5e7f0;
    --text-dim:#9aa0b8;
    --accent:#6fb8e0;
    --accent2:#e0b76f;
    --accent3:#8fd0a8;
    --danger:#e08f8f;
    --shadow:0 2px 8px rgba(0,0,0,0.4);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.7;
  }
  #app{display:flex; min-height:100vh;}
  #sidebar{
    width:230px; flex-shrink:0; background:var(--bg2);
    border-right:1px solid var(--border);
    padding:18px 10px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  #sidebar h1{font-size:15px; color:var(--accent); margin:4px 8px 16px; line-height:1.4;}
  .navbtn{
    display:block; width:100%; text-align:left; padding:10px 12px; margin-bottom:4px;
    background:transparent; border:none; color:var(--text-dim); border-radius:8px;
    font-size:13.5px; cursor:pointer; transition:background .15s,color .15s;
  }
  .navbtn:hover{background:var(--bg3); color:var(--text);}
  .navbtn.active{background:var(--accent); color:#12141c; font-weight:bold;}
  #main{flex:1; padding:28px 36px; max-width:980px;}
  h2.pagetitle{color:var(--accent); border-bottom:1px solid var(--border); padding-bottom:10px; margin-top:0;}
  .lvltabs{display:flex; gap:8px; margin:16px 0 20px;}
  .lvltab{
    padding:8px 16px; border-radius:20px; border:1px solid var(--border); background:var(--bg2);
    color:var(--text-dim); cursor:pointer; font-size:13px;
  }
  .lvltab.active{background:var(--accent); color:#12141c; border-color:var(--accent); font-weight:bold;}
  .progressbar{height:8px; border-radius:4px; background:var(--bg3); overflow:hidden; margin:6px 0 2px;}
  .progressbar > div{height:100%; background:var(--accent3);}
  .progress-label{font-size:12px; color:var(--text-dim); margin-bottom:14px;}
  .card{
    background:var(--bg2); border:1px solid var(--border); border-radius:10px;
    padding:16px 18px; margin-bottom:14px; box-shadow:var(--shadow);
  }
  .card.done{border-left:4px solid var(--accent3);}
  .card.review{border-left:4px solid var(--accent2);}
  .qlabel{font-size:11px; color:var(--text-dim); letter-spacing:.05em; margin-bottom:6px;}
  .qtext{white-space:pre-wrap; font-size:14.5px; margin-bottom:10px;}
  .atext{white-space:pre-wrap; font-size:14px; color:#d7d9e6; background:var(--bg3); border-radius:8px; padding:12px 14px; margin-top:10px; display:none;}
  .atext.show{display:block;}
  .btnrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
  button.small{
    padding:6px 12px; border-radius:6px; border:1px solid var(--border); background:var(--bg3);
    color:var(--text); cursor:pointer; font-size:12.5px;
  }
  button.small:hover{background:#2a2d42;}
  button.small.primary{background:var(--accent); color:#12141c; border-color:var(--accent); font-weight:bold;}
  button.small.ok{border-color:var(--accent3); color:var(--accent3);}
  button.small.ok.active{background:var(--accent3); color:#12141c;}
  button.small.warn{border-color:var(--accent2); color:var(--accent2);}
  button.small.warn.active{background:var(--accent2); color:#12141c;}
  .sectionlist{font-size:12.5px; color:var(--text-dim); margin-bottom:18px; line-height:2;}
  table{border-collapse:collapse; width:100%; margin:14px 0;}
  th,td{border:1px solid var(--border); padding:8px 10px; font-size:13px; text-align:left; vertical-align:top;}
  th{background:var(--bg3); color:var(--accent);}
  .weekcard{background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:14px 18px; margin-bottom:12px;}
  .weekhead{display:flex; justify-content:space-between; align-items:center;}
  .weekhead b{color:var(--accent2);}
  .tag{display:inline-block; padding:2px 8px; border-radius:12px; background:var(--bg3); color:var(--text-dim); font-size:11px; margin-right:6px;}
  .examcard{background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:18px; margin-bottom:14px; cursor:pointer;}
  .examcard:hover{border-color:var(--accent);}
  .examcard h3{margin:0 0 6px; color:var(--accent);}
  .backlink{color:var(--accent); cursor:pointer; font-size:13px; margin-bottom:14px; display:inline-block;}
  .dashrow{display:grid; grid-template-columns:120px 1fr 60px; align-items:center; gap:10px; margin-bottom:8px; font-size:13px;}
  .note{background:var(--bg3); border-left:3px solid var(--accent); padding:10px 14px; border-radius:6px; font-size:13px; color:var(--text-dim); margin:14px 0;}
  .resetbtn{margin-top:24px; font-size:12px; color:var(--danger); background:none; border:1px solid var(--danger); border-radius:6px; padding:6px 12px; cursor:pointer;}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>解析入門I<br><span style="font-size:11px;color:var(--text-dim);font-weight:normal;">杉浦光夫 学習アプリ</span></h1>
    <div id="navlist"></div>
    <button class="resetbtn" onclick="resetAllProgress()">進捗を全リセット</button>
  </div>
  <div id="main"></div>
</div>

<script>
/* ============ データ定義 ============ */

const CHAPTERS = [
{
  id:'ch1', title:'第I章 実数と連続',
  sections:['§1 実数','§2 実数列の極限','§3 実数の連続性','§4 R^n と C','§5 級数','§6 極限と連続','§7 コンパクト集合','§8 中間値の定理'],
  level1:[
    {q:'上界・上限（最小上界）の定義を述べよ。', a:'集合S⊂Rの上界とは、すべてのx∈Sに対しx≤Mを満たす実数Mのこと。上限 sup S とは、Sの上界全体の中で最小のもの、すなわち(i)Sの上界であり、(ii)任意の上界M\'に対し sup S≤M\' を満たす実数。'},
    {q:'実数の連続性公理（上限の存在定理）を述べよ。', a:'上に有界な空でない実数の部分集合Sは、必ず上限 sup S を持つ（Rの中に存在する）。これがRの他の順序体（例えばQ）にはない本質的性質＝連続性である。'},
    {q:'アルキメデスの原理を述べよ。', a:'任意の正の実数a,bに対して、na>bとなる自然数nが存在する。（実数には「無限大」「無限小」に相当する元がない、という主張。）'},
    {q:'数列{a_n}がαに収束することの定義（ε-N論法）を述べよ。', a:'任意のε>0に対しある自然数Nが存在し、n≥N ならば |a_n−α|<ε が成り立つこと。'},
    {q:'コーシー列（基本列）の定義を述べよ。', a:'任意のε>0に対しある自然数Nが存在し、m,n≥N ならば |a_m−a_n|<ε となる数列 {a_n}。'},
    {q:'実数の完備性（コーシー列の収束定理）を述べよ。', a:'実数のコーシー列は必ず収束する。すなわちRはコーシー列に関して完備である（Qはこの性質を持たない）。'},
    {q:'ボルツァノ・ワイエルシュトラスの定理を述べよ。', a:'有界な実数列は収束する部分列を少なくとも一つ持つ。'},
    {q:'区間縮小法（Cantorの区間縮小の原理）を述べよ。', a:'閉区間の減少列 I_1⊃I_2⊃… (I_n=[a_n,b_n]) で長さ b_n−a_n→0 ならば、∩I_n はただ一点からなる。'},
    {q:'数列の上極限 limsup、下極限 liminf の定義を述べよ。', a:'limsup a_n = lim_{n→∞}(sup_{k≥n} a_k)、liminf a_n = lim_{n→∞}(inf_{k≥n} a_k)。単調性からこれらの極限は常に（±∞を許せば）存在する。'},
    {q:'単調収束定理を述べよ。', a:'単調増加（減少）で上に（下に）有界な実数列は収束する。極限値はその数列の上限（下限）に一致する。'},
    {q:'級数Σa_nが収束することの定義を述べよ。', a:'部分和 S_n=a_1+…+a_n が n→∞ である実数Sに収束するとき、級数はSに収束するといい、Σa_n=Sと書く。'},
    {q:'絶対収束の定義と、絶対収束から収束が従うことを述べよ。', a:'Σ|a_n|が収束するとき、Σa_nは絶対収束するという。絶対収束すればコーシー列の判定（|a_{n+1}+…+a_m|≤|a_{n+1}|+…+|a_m|）により元の級数Σa_nも収束する。'},
    {q:'R^nにおける開集合・閉集合・εー近傍の定義を述べよ。', a:'点aのε近傍とは {x∈R^n : |x−a|<ε}。集合Uが開集合とは、任意のa∈Uに対しあるε>0が存在しεー近傍がUに含まれること。閉集合とは補集合が開集合であること（あるいは収束する点列の極限を常に含むこと）。'},
    {q:'コンパクト集合の定義（開被覆による定義）と、R^nでの特徴づけを述べよ。', a:'任意の開被覆が有限部分被覆を持つ集合をコンパクトという。R^nでは、コンパクト⇔有界かつ閉（ハイネ・ボレルの定理）。'},
    {q:'連続関数の定義（ε-δ論法）を述べよ。', a:'関数fが点aで連続とは、任意のε>0に対しあるδ>0が存在し、|x−a|<δ ならば |f(x)−f(a)|<ε となること。'},
    {q:'一様連続の定義を述べ、連続との違いを説明せよ。', a:'任意のε>0に対しあるδ>0が存在し、任意のx,yについて|x−y|<δ ならば |f(x)−f(y)|<ε となるとき一様連続という。通常の連続はδが各点aごとに選べればよいが、一様連続はδが全域で共通に取れる点が異なる。'},
    {q:'中間値の定理を述べよ。', a:'fが[a,b]で連続で f(a)<γ<f(b)（またはf(a)>γ>f(b)）ならば、f(c)=γ となる c∈(a,b) が存在する。'},
    {q:'最大値・最小値の定理を述べよ。', a:'コンパクト集合（R上では有界閉区間）上で定義された連続関数は、最大値・最小値を（その集合内で）必ず取る。'},
    {q:'複素数体Cの定義と絶対値、極形式を述べよ。', a:'C={a+bi : a,b∈R}, i^2=−1。絶対値|z|=√(a^2+b^2)。極形式 z=r(cosθ+i sinθ), r=|z|。'},
    {q:'有界な数列の定義を述べよ。', a:'ある実数Mが存在し、すべてのnについて|a_n|≤Mとなること。'},
  ],
  level2:[
    {q:'sup Sの存在性から、任意のε>0に対し sup S−ε<x≤sup S となるx∈Sが存在することを示せ。', a:'sup S−ε は sup S より小さいので上界ではない（supは最小の上界）。よってある x∈S が sup S−ε<x を満たす。一方xはSの元だから x≤sup S。以上より sup S−ε<x≤sup S。'},
    {q:'単調増加かつ上に有界な数列{a_n}は収束することを、上限の存在定理を用いて示せ。', a:'{a_n}は上に有界なので α=sup{a_n : n∈N} が存在する。任意のε>0に対し、上のsupの性質からある N があって α−ε<a_N≤α。単調増加性より n≥N で a_N≤a_n≤α なので α−ε<a_n≤α<α+ε、すなわち|a_n−α|<ε。よってa_n→α。'},
    {q:'ボルツァノ・ワイエルシュトラスの定理を区間縮小法を用いて証明せよ。', a:'{a_n}⊂[c,d]とする。中点で2等分し、無限個のa_nを含む方を選び I_1 とする。これを繰り返し I_1⊃I_2⊃… で長さ→0の閉区間列を作る。各I_kには無限に多くの項があるので、部分列 a_{n_k}∈I_k を n_1<n_2<… となるよう取れる。区間縮小法により∩I_kは一点αからなり、|a_{n_k}−α|≤length(I_k)→0 なので a_{n_k}→α。'},
    {q:'コーシー列は有界であることを示し、実数の完備性（コーシー列は収束部分列を持てば全体も同じ極限に収束すること）を用いてコーシー列が収束することを示せ。', a:'ε=1にとると、あるNで m,n≥N ⟹ |a_m−a_n|<1、特に n≥N で |a_n|≤|a_N|+1。有限個のa_1,…,a_{N-1}も込めて全体は有界。有界数列なのでB-Wの定理より収束部分列a_{n_k}→αを持つ。任意のε>0に対しNをコーシー性から取り、さらにkを大きく取ってn_k≥N かつ|a_{n_k}−α|<ε/2とすると、n≥Nに対し|a_n−α|≤|a_n−a_{n_k}|+|a_{n_k}−α|<ε/2+ε/2=ε。よってa_n→α。'},
    {q:'[a,b]上の連続関数は最大値を取ることを証明せよ。', a:'M=sup{f(x):x∈[a,b]}（∈R∪{∞}）とする。supの定義よりf(x_n)→Mとなる点列x_nが取れる。[a,b]は有界なのでB-Wの定理より収束部分列x_{n_k}→c∈[a,b]がある。fの連続性よりf(x_{n_k})→f(c)。一方f(x_{n_k})→Mだから f(c)=M。特にM<∞（有限）で、f(c)がSの最大値。'},
    {q:'中間値の定理を実数の連続性（上限の存在）を用いて証明せよ。', a:'f(a)<γ<f(b)とする。S={x∈[a,b] : f(x)<γ}は空でなく（aを含む）上に有界（bで抑えられる）なのでc=sup Sが存在する。fの連続性から、f(c)<γとすると近くでもf<γとなりcより大きい点もSに入り矛盾、f(c)>γとすると近くでf>γとなりcがsupであることに矛盾（supより小さいところで既にf≥γとなってしまう）。よってf(c)=γ。'},
    {q:'[a,b]上の連続関数は一様連続であることを示せ（コンパクト性を用いる）。', a:'背理法。一様連続でないとすると、あるε>0が存在し任意のδ=1/nに対しx_n,y_nで|x_n−y_n|<1/nかつ|f(x_n)−f(y_n)|≥εとなるものが取れる。[a,b]の有界性からB-Wの定理でx_{n_k}→c（部分列）、|x_n-y_n|→0より y_{n_k}→c も同じcに収束。連続性からf(x_{n_k})→f(c), f(y_{n_k})→f(c)なので|f(x_{n_k})−f(y_{n_k})|→0となり ε≤|f(x_{n_k})−f(y_{n_k})|→0 に矛盾。'},
  ],
  level3:[
    {q:'f:[0,1]→[0,1]が連続ならば、f(c)=cとなるc∈[0,1]が存在することを示せ（不動点定理）。', a:'g(x)=f(x)−xとおくとgは連続。g(0)=f(0)−0≥0、g(1)=f(1)−1≤0（値域が[0,1]なので）。g(0)≥0≥g(1)なので中間値の定理よりg(c)=0となるcが存在、すなわちf(c)=c。（g(0)=0またはg(1)=0の場合も含め成立。）'},
    {q:'a_1=√2, a_{n+1}=√(2+a_n) で定まる数列の収束性を示し、極限値を求めよ。', a:'帰納法で0<a_n<2を示す：a_1=√2<2。a_n<2ならa_{n+1}=√(2+a_n)<√4=2。また a_{n+1}−a_n=√(2+a_n)−a_n。a_n<2のとき2+a_n>a_n^2（∵a_n^2−a_n−2=(a_n−2)(a_n+1)<0）なので√(2+a_n)>a_n、単調増加。単調増加かつ上に有界(<2)なので収束（単調収束定理）。極限をαとするとα=√(2+α)よりα^2=2+α、α^2−α−2=0、(α−2)(α+1)=0、α≥0よりα=2。'},
    {q:'limsup(a_n+b_n) ≤ limsup a_n + limsup b_n を示し、一般に等号が成立しない例を挙げよ。', a:'任意のnに対し sup_{k≥n}(a_k+b_k) ≤ sup_{k≥n}a_k + sup_{k≥n}b_k （各項で上から抑えられるため）。n→∞の極限を取れば不等式が従う（極限は単調性から存在）。等号不成立の例：a_n=(−1)^n, b_n=(−1)^{n+1}とすると a_n+b_n=0（定数列）なのでlimsup(a_n+b_n)=0だが、limsup a_n=1, limsup b_n=1で和は2。0<2で真に不等号。'},
    {q:'閉集合かつ有界でない（コンパクトでない）集合の例を挙げ、その集合上で定義された連続関数で最大値を持たないものを構成せよ。', a:'例：S=[0,∞)（閉だが有界でない）。f(x)=x/(1+x)は連続で単調増加、sup f=1だが、任意のx∈Sでf(x)<1なので最大値は存在しない。（有界でないため最大値定理の仮定＝コンパクト性が満たされない。）'},
    {q:'コーシー列の定義を用いて、Σ1/n（調和級数）が発散することを示せ。', a:'部分和S_nがコーシー列でないことを示す。S_{2n}−S_n=1/(n+1)+…+1/(2n)≥n・(1/(2n))=1/2。よってε=1/2に対しどれだけnを大きくしてもm=2nとの差が1/2以上になり、コーシー条件を満たさない。実数の完備性より収束するならコーシー列のはずなので、収束しない＝発散する。'},
    {q:'R^nの有界閉集合K上の連続関数fが一様連続であることを用いて、任意のε>0に対しfをある有限個の値による「階段近似」で一様にε未満の誤差で近似できることを説明せよ。', a:'一様連続性より、あるδ>0が存在し|x−y|<δ⟹|f(x)−f(y)|<εとなる。Kは有界なので、一辺δ未満の格子で有限個のブロックに分割しK被覆できる（コンパクト性より有限被覆）。各ブロックの代表点での値を階段関数として採用すれば、ブロック内の任意の点との距離はδ未満なので|f(x)−(近似値)|<εが全域で成立し、一様な誤差ε未満の近似が得られる。'},
  ],
},
{
  id:'ch2', title:'第II章 微分法',
  sections:['§1 実変数函数の微分法','§2 平均値の定理','§3 方向微分と偏微分','§4 無限小・無限大の次数','§5 多変数実数値函数の微分法','§6 多変数ベクトル値函数の微分法','§7 テイラーの定理と微分','§8 最大最小と極値'],
  level1:[
    {q:'1変数関数fが点aで微分可能であることの定義を述べよ。', a:'極限 lim_{h→0} (f(a+h)−f(a))/h が存在すること。この極限値をf\'(a)と書き、微分係数という。'},
    {q:'微分係数f\'(a)の幾何学的意味を述べよ。', a:'点(a,f(a))における接線の傾き。すなわち接線の方程式はy=f(a)+f\'(a)(x−a)。'},
    {q:'ロルの定理を述べよ。', a:'fが[a,b]で連続、(a,b)で微分可能、f(a)=f(b)ならば、f\'(c)=0となるc∈(a,b)が存在する。'},
    {q:'平均値の定理（ラグランジュ）を述べよ。', a:'fが[a,b]で連続、(a,b)で微分可能ならば、(f(b)−f(a))/(b−a)=f\'(c) となるc∈(a,b)が存在する。'},
    {q:'コーシーの平均値の定理を述べよ。', a:'f,gが[a,b]で連続、(a,b)で微分可能、g\'(x)≠0とすると、(f(b)−f(a))/(g(b)−g(a))=f\'(c)/g\'(c) となるc∈(a,b)が存在する。'},
    {q:'方向微分の定義を述べよ。', a:'多変数関数fの点aにおける方向v（|v|=1が普通）への方向微分は、D_v f(a)=lim_{t→0}(f(a+tv)−f(a))/t。'},
    {q:'偏微分係数の定義を述べよ。', a:'∂f/∂x_i(a)=lim_{h→0}(f(a+he_i)−f(a))/h（e_iは第i標準基底方向への方向微分）。'},
    {q:'C^1級関数の定義と、偏微分可能でも（全）微分可能とは限らないことの注意を述べよ。', a:'すべての偏導関数が存在し連続であるときC^1級という。偏微分可能なだけでは連続性すら保証されず、全微分可能（フレシェ微分可能）より弱い概念。C^1級ならば全微分可能であることは定理として証明される。'},
    {q:'ランダウの記号 o, O の定義を述べよ。', a:'x→aのときf(x)=o(g(x))とは lim_{x→a} f(x)/g(x)=0 となること。f(x)=O(g(x))とは、あるM,δ>0が存在し0<|x−a|<δで|f(x)|≤M|g(x)|となること。'},
    {q:'多変数実数値関数fの点aにおける（フレシェ）微分可能性の定義と勾配ベクトルを述べよ。', a:'ある線形写像（ベクトル）grad f(a)=∇f(a)が存在し、f(a+h)=f(a)+∇f(a)・h+o(|h|)（h→0）となるとき微分可能という。∇f(a)=(∂f/∂x_1(a),…,∂f/∂x_n(a))。'},
    {q:'多変数ベクトル値関数の微分（ヤコビ行列）の定義を述べよ。', a:'f:R^n→R^mが点aで微分可能とは、あるm×n行列f\'(a)（ヤコビ行列、各(i,j)成分が∂f_i/∂x_j(a)）が存在し f(a+h)=f(a)+f\'(a)h+o(|h|) となること。'},
    {q:'合成関数の微分法（連鎖律）を述べよ。', a:'f,gが微分可能ならば合成g∘fも微分可能で、(g∘f)\'(a)=g\'(f(a))f\'(a)（多変数では行列の積として）。'},
    {q:'テイラーの定理（ラグランジュの剰余項）を述べよ。', a:'fがn+1回微分可能ならば、f(a+h)=Σ_{k=0}^n f^{(k)}(a)/k! h^k + f^{(n+1)}(a+θh)/(n+1)! h^{n+1}（0<θ<1）と書ける。'},
    {q:'極値の必要条件（停留点）と2変数関数のヘッセ行列による十分条件を述べよ。', a:'必要条件：極値点aでは∇f(a)=0（停留点）。十分条件（2変数）：ヘッセ行列H=[[f_xx,f_xy],[f_xy,f_yy]]の判別式D=f_xx f_yy−f_xy^2について、D>0かつf_xx>0なら極小、D>0かつf_xx<0なら極大、D<0なら鞍点（極値でない）、D=0は判定不能。'},
    {q:'ロピタルの定理（不定形の極限）を述べよ。', a:'x→aでf(x),g(x)→0（または±∞）、g\'(x)≠0で、lim f\'(x)/g\'(x)=Lが存在すれば、lim f(x)/g(x)=Lも成り立つ。'},
  ],
  level2:[
    {q:'f\'(a)が存在すればfはaで連続であることを証明せよ。', a:'f(a+h)−f(a)=[(f(a+h)−f(a))/h]・h → f\'(a)・0=0（h→0）。よってf(a+h)→f(a)、すなわち連続。'},
    {q:'ロルの定理を用いて平均値の定理を証明せよ。', a:'g(x)=f(x)−f(a)−[(f(b)−f(a))/(b−a)](x−a)とおくとg(a)=g(b)=0でgは[a,b]で連続、(a,b)で微分可能。ロルの定理よりg\'(c)=0となるcが存在。g\'(x)=f\'(x)−(f(b)−f(a))/(b−a)なので、f\'(c)=(f(b)−f(a))/(b−a)。'},
    {q:'平均値の定理を用いて「(a,b)上でf\'(x)=0が恒等的に成り立てばfは(a,b)上定数」であることを示せ。', a:'任意のx,y∈(a,b) (x<y)に対し平均値の定理より(f(y)−f(x))/(y−x)=f\'(c)=0となるcが存在するのでf(y)=f(x)。よってfは定数。'},
    {q:'2変数関数f(x,y)=xy/(x^2+y^2) (原点以外), f(0,0)=0 は原点で偏微分可能だが、全微分可能でない（実は原点で連続でさえない）ことを示せ。', a:'∂f/∂x(0,0)=lim_{h→0}(f(h,0)−f(0,0))/h=lim(0/h^2)/h=0、同様に∂f/∂y(0,0)=0。しかしy=xに沿って(x,x)→(0,0)とすると f(x,x)=x^2/(2x^2)=1/2 で0に収束しない。よって原点で連続でなく、したがって全微分可能でもない（連続性は微分可能性の必要条件）。'},
    {q:'合成関数の微分法（連鎖律）を証明せよ（1変数の場合）。', a:'h(x)=g(f(x))とする。f(a+Δx)=f(a)+f\'(a)Δx+ε_1(Δx)Δx（ε_1→0）、g(f(a)+Δy)=g(f(a))+g\'(f(a))Δy+ε_2(Δy)Δy（ε_2→0）とおく。Δy=f\'(a)Δx+ε_1Δxを代入し整理すると、h(a+Δx)−h(a)=g\'(f(a))f\'(a)Δx+o(Δx)となり、h\'(a)=g\'(f(a))f\'(a)。'},
    {q:'コーシーの平均値の定理を用いて、テイラーの定理（ラグランジュの剰余項、n=1の場合）を導け。', a:'F(x)=f(b)−f(x)−f\'(x)(b−x)、G(x)=(b−x)^2 とおく。F(b)=G(b)=0。コーシーの平均値の定理より (F(b)−F(a))/(G(b)−G(a))=F\'(c)/G\'(c) となるcが存在。F\'(x)=−f\'\'(x)(b−x)、G\'(x)=−2(b−x)なので F\'(c)/G\'(c)=f\'\'(c)/2。計算すると f(a)+f\'(a)(b−a)から f(b)=f(a)+f\'(a)(b−a)+f\'\'(c)/2・(b−a)^2 が得られる（n=1の場合のラグランジュ剰余）。'},
  ],
  level3:[
    {q:'f:R→Rが2階微分可能でf\'\'(x)>0（すべてのx）ならば、任意のx,yと0<t<1に対しf(tx+(1−t)y)≤tf(x)+(1−t)f(y)であること（凸性）を示せ。', a:'z=tx+(1−t)yとおく。テイラーの定理より f(x)=f(z)+f\'(z)(x−z)+f\'\'(ξ_1)/2(x−z)^2 ≥ f(z)+f\'(z)(x−z)（f\'\'>0のため）。同様にf(y)≥f(z)+f\'(z)(y−z)。t倍と(1−t)倍して足すと tf(x)+(1−t)f(y) ≥ f(z)+f\'(z)[t(x−z)+(1−t)(y−z)] = f(z)+f\'(z)・0 = f(z)。（∵t(x−z)+(1−t)(y−z)=tx+(1−t)y−z=0。）'},
    {q:'lim_{x→0} (sin x − x)/x^3 をテイラー展開を用いて求めよ。', a:'sin x = x − x^3/6 + O(x^5)。よって(sin x−x)/x^3 = −1/6 + O(x^2) → −1/6。'},
    {q:'2変数関数f(x,y)=x^3−3xy^2 の停留点を求め、それぞれが極大・極小・鞍点のいずれかを判定せよ。', a:'∇f=(3x^2−3y^2, −6xy)=0 より x^2=y^2 かつ xy=0。xy=0からx=0またはy=0。x=0のときy^2=0でy=0。y=0のときx^2=0でx=0。よって停留点は原点のみ。ヘッセ行列H=[[6x,−6y],[−6y,−6x]]、原点で全て0行列なので判別式D=0で通常の判定は不能。実際f(x,0)=x^3は原点付近で符号を変える（モンキーサドル）ので原点は極値ではない鞍点的な特異点。'},
    {q:'fが[a,b]で微分可能でf\'(a)<c<f\'(b)ならばf\'(ξ)=cとなるξ∈(a,b)が存在すること（ダルブーの定理）を示せ。', a:'g(x)=f(x)−cxとおく。g\'(a)=f\'(a)−c<0、g\'(b)=f\'(b)−c>0。gは[a,b]で連続なので最小値をある点ξで取る。g\'(a)<0より aの近くでgはaより小さい値を取るのでξ≠a。同様にg\'(b)>0よりξ≠b。よってξは内点での極小点、微分可能な関数の内点極値点ではg\'(ξ)=0、すなわちf\'(ξ)=c。（導関数は連続でなくても中間値の性質を持つ、という有名な結果。）'},
    {q:'平均値の定理を用いて、すべての実数xに対しe^x≥1+xであることを証明せよ。', a:'x=0のとき等号。x>0のとき、f(t)=e^tは[0,x]で平均値の定理よりe^x−1=e^c・x（0<c<x）。e^c>e^0=1（増加関数）なのでe^x−1>x、すなわちe^x>1+x。x<0のときも同様に[x,0]で平均値の定理を適用すると1−e^x=e^c(0−x)=−e^c x（x<c<0）。e^c<1なので1−e^x<−x（xは負なので不等号の向きに注意すると）、整理してe^x≥1+xが得られる。'},
  ],
},
{
  id:'ch3', title:'第III章 初等函数',
  sections:['§1 複素変数函数の微分法','§2 整級数','§3 初等函数1．指数函数，三角函数','§4 初等函数2．対数函数，逆三角函数'],
  level1:[
    {q:'整級数（べき級数）Σa_n(z−c)^nの収束半径の定義とコーシー・アダマールの公式を述べよ。', a:'収束半径Rとは、|z−c|<Rで絶対収束、|z−c|>Rで発散するような（0≤R≤∞の）値。公式：1/R=limsup_{n→∞} |a_n|^{1/n}（この極限が0ならR=∞、∞ならR=0）。'},
    {q:'整級数は収束円内で項別微分・項別積分可能であることの主張を述べよ。', a:'f(z)=Σa_n(z−c)^nが|z−c|<Rで収束するとき、fは収束円内で何回でも微分可能（複素の場合は正則）で、f\'(z)=Σn・a_n(z−c)^{n−1}も同じ収束半径を持ち、項別積分も同様に成り立つ。'},
    {q:'指数関数e^zの整級数による定義を述べよ。', a:'e^z=Σ_{n=0}^∞ z^n/n! （収束半径∞）。'},
    {q:'cos z, sin z の整級数による定義とオイラーの公式を述べよ。', a:'cos z=Σ(−1)^n z^{2n}/(2n)!、sin z=Σ(−1)^n z^{2n+1}/(2n+1)!。オイラーの公式：e^{ix}=cos x+i sin x（xは実数、整級数の定義から直接導かれる）。'},
    {q:'指数法則e^{z+w}=e^z e^w の主張を述べよ。', a:'任意の複素数z,wに対しこの等式が成立する（べき級数のコーシー積と二項定理を用いて証明される）。'},
    {q:'複素変数関数の（複素）微分可能性の定義を述べよ。', a:'f:C→Cが点zで複素微分可能とは、極限lim_{h→0}(f(z+h)−f(z))/h（hは複素数として0に近づく）が存在すること。この極限をf\'(z)と書く。'},
    {q:'対数関数（複素対数）の定義とその多価性、主値について述べよ。', a:'log z = log|z| + i arg z（argは2πの整数倍の不定性を持つ多価関数）。主値Log zは通常−π<arg z≤πの範囲に制限した一価の枝を指す。'},
    {q:'逆三角関数arcsin, arccos, arctanの定義とその導関数を述べよ。', a:'y=arcsin x ⟺ x=sin y (−π/2≤y≤π/2)、d/dx arcsin x=1/√(1−x^2)。y=arccos x ⟺ x=cos y (0≤y≤π)、d/dx arccos x=−1/√(1−x^2)。y=arctan x ⟺ x=tan y (−π/2<y<π/2)、d/dx arctan x=1/(1+x^2)。'},
    {q:'双曲線関数sinh, coshの定義と基本性質を述べよ。', a:'sinh x=(e^x−e^{−x})/2, cosh x=(e^x+e^{−x})/2。cosh^2x−sinh^2x=1、(sinh x)\'=cosh x、(cosh x)\'=sinh x。'},
    {q:'円周率πはこの本ではどのように定義されるか説明せよ。', a:'cos xの整級数の性質から、cos xが正の実数で最初に0になる値の2倍としてπを定義する（cos(π/2)=0となる最小の正数としてπ/2を定義するアプローチ）。'},
    {q:'三角関数の加法定理を述べよ。', a:'cos(x+y)=cos x cos y − sin x sin y、sin(x+y)=sin x cos y + cos x sin y。（整級数の定義とe^{i(x+y)}=e^{ix}e^{iy}から導かれる。）'},
    {q:'整級数の一致の定理（初歩形）を述べよ。', a:'|z|<Rで収束する整級数Σa_n z^nが恒等的に0であれば、すべての係数a_n=0である。'},
    {q:'複素数の極形式とド・モアブルの定理を述べよ。', a:'z=r(cosθ+i sinθ)のときz^n=r^n(cos nθ+i sin nθ)（ド・モアブルの定理）。'},
    {q:'(1+x)^αの二項級数展開を述べよ。', a:'(1+x)^α=Σ_{n=0}^∞ C(α,n) x^n （|x|<1）、ここでC(α,n)=α(α−1)…(α−n+1)/n!。'},
  ],
  level2:[
    {q:'コーシー・アダマールの公式（収束半径の公式）を証明せよ（概略）。', a:'ρ=limsup|a_n|^{1/n}とする。|z−c|<1/ρのとき、ρ+εで抑えて|a_n(z−c)^n|≤((ρ+ε)|z−c|)^nとなるεが取れ、比が1未満の等比級数と比較して絶対収束。|z−c|>1/ρのときは無限個のnで|a_n(z−c)^n|が有界でなくなるので発散。よってR=1/ρ。'},
    {q:'e^{z+w}=e^z e^w をべき級数のコーシー積を用いて証明せよ。', a:'e^z e^w=(Σz^n/n!)(Σw^m/m!)。コーシー積の公式より、この積は Σ_k [Σ_{n+m=k} z^n w^m/(n!m!)] = Σ_k (1/k!)Σ_{n=0}^k C(k,n)z^n w^{k−n} = Σ_k (z+w)^k/k! = e^{z+w}（二項定理を使用、絶対収束級数なのでコーシー積が正当化される）。'},
    {q:'オイラーの公式e^{ix}=cos x + i sin x を整級数の定義から示せ。', a:'e^{ix}=Σ(ix)^n/n!。i^n は周期4で1,i,−1,−iを繰り返すことを用いて実部・虚部に分けると、実部=Σ(−1)^k x^{2k}/(2k)!=cos x、虚部=Σ(−1)^k x^{2k+1}/(2k+1)!=sin x。よってe^{ix}=cos x+i sin x。'},
    {q:'sin^2x+cos^2x=1を証明せよ。', a:'f(x)=sin^2x+cos^2xとおくとf\'(x)=2sinx cosx+2cosx(−sinx)=0。よってfは定数。f(0)=0+1=1なので、すべてのxでf(x)=1。'},
    {q:'整級数は収束円の内部で項別微分可能であることを（結果として）用いて、Σn x^{n-1}の収束半径がΣx^nの収束半径と一致することを示せ。', a:'収束半径の公式1/R=limsup|a_n|^{1/n}において、a_n=1に対しa_n\'=nの場合、limsup(n)^{1/n}=1（n^{1/n}→1）なので、係数にnを掛けても収束半径は変化しない。一般に係数にn(多項式的因子)を掛けてもlimsupのn乗根の極限に影響しないため、微分後の級数も同じ収束半径を持つ。'},
    {q:'log(1+x)のマクローリン展開とその収束半径を求めよ。', a:'d/dx log(1+x)=1/(1+x)=Σ(−1)^n x^n（|x|<1の等比級数）。項別積分してlog(1+x)=Σ_{n=1}^∞ (−1)^{n−1} x^n/n。収束半径は1/(1+x)の展開と同じくR=1。'},
  ],
  level3:[
    {q:'e=Σ1/n! が無理数であることを示せ。', a:'背理法。e=p/q（p,q自然数）とする。q!eはq!Σ_{n=0}^∞1/n! = q!Σ_{n=0}^q 1/n! + q!Σ_{n=q+1}^∞1/n! であり、前半は整数。後半をRとおくとR=Σ_{n=q+1}^∞ q!/n! < Σ_{k=1}^∞ 1/(q+1)^k = 1/q （等比級数、各項をq!/n!≤1/(q+1)^{n−q}で評価）で0<R<1。よってq!eは整数＋(0と1の間の数)となり整数でない。しかしq!e=q!・p/q=p(q−1)!は整数のはずで矛盾。よってeは無理数。'},
    {q:'cos, sinの整級数表示から周期性cos(x+2π)=cos xを導く道筋を述べよ。', a:'πの定義（cos(π/2)=0となる最小の正数の2倍）より、加法定理からcos(π)=cos^2(π/2)−sin^2(π/2)=0−1=−1（sin(π/2)=1は sin^2+cos^2=1と符号の考察から）。さらにcos(2π)=2cos^2(π)−1=2・1−1=1、sin(2π)=2sin(π)cos(π)=2・0・(−1)=0。加法定理よりcos(x+2π)=cos x cos 2π − sin x sin 2π = cos x・1 − sin x・0 = cos x。'},
    {q:'z^n=1の解（1のn乗根）を複素平面上に図示する式を求め、その総和が0になることを示せ（n≥2）。', a:'解は z_k=e^{2πik/n} (k=0,1,…,n−1)で、単位円周上に正n角形の頂点として並ぶ。総和Σz_k=Σe^{2πik/n}は公比e^{2πi/n}(≠1、n≥2)の等比数列の和で、公式Σ_{k=0}^{n-1}r^k=(r^n−1)/(r−1)にr=e^{2πi/n}を代入するとr^n=1なので分子が0となり、総和=0。'},
    {q:'arctan xのテイラー展開を用いて π/4=1−1/3+1/5−… を導け。', a:'1/(1+x^2)=Σ(−1)^n x^{2n} (|x|<1)を項別積分してarctan x=Σ(−1)^n x^{2n+1}/(2n+1)。x=1はこの級数の収束半径の境界だが、アーベルの定理（べき級数の境界での連続性）により、Σ(−1)^n/(2n+1)が収束すればその和はarctan(1)=π/4に一致する。ライプニッツの判定法よりこの交代級数は収束するので、1−1/3+1/5−…=π/4。'},
    {q:'複素関数e^zが周期2πiを持つことを示せ。', a:'e^{z+2πi}=e^z e^{2πi}（指数法則）。e^{2πi}=cos(2π)+i sin(2π)=1+0i=1（前問と同様の計算）。よってe^{z+2πi}=e^z、周期2πiを持つ。'},
  ],
},
{

  sections:['§1 積分の意味','§2 積分の定義','§3 可積分条件','§4 連続函数の可積分性','§5 一変数函数の積分','§6 不定積分の計算','§7 累次積分','§8 有界集合上の積分','§9 零集合と可積分条件','§10 極座標への変換','§11 広義積分（一次元）','§12 Γ函数とB函数','§13 一様収束と項別微積分','§14 径数を含む積分','§15 Γ函数の性質','§16 曲線の長さ','§17 有界変動函数とスチルチェス積分'],

    {q:'リーマン可積分の定義を述べよ。', a:'|Δ|→0のときリーマン和S(Δ,ξ)が代表点ξの取り方によらず一定値Iに収束するとき、fは[a,b]でリーマン可積分といい、I=∫_a^b f(x)dxと書く。'},
    {q:'上積分・下積分（ダルブーの上和・下和）の定義を述べよ。', a:'分割Δの各小区間でのfの上限M_i、下限m_iを用い、上和U(Δ)=ΣM_iΔx_i、下和L(Δ)=Σm_iΔx_i。上積分=inf_Δ U(Δ)、下積分=sup_Δ L(Δ)。'},
    {q:'ダルブーの可積分条件を述べよ。', a:'fが[a,b]で有界であるとき、fが可積分であることと、任意のε>0に対しU(Δ)−L(Δ)<εとなる分割Δが存在することは同値。'},
    {q:'連続関数は有界閉区間上でリーマン可積分であることの主張を述べよ。', a:'fが[a,b]で連続ならば、fは[a,b]で一様連続（コンパクト性より）であり、これを用いてダルブーの条件を満たすことが示され、fは可積分である。'},
    {q:'微積分学の基本定理を述べよ。', a:'fが[a,b]で連続でF(x)=∫_a^x f(t)dtとおくと、FはC^1級でF\'(x)=f(x)。また、Fがfの原始関数（F\'=f）ならば∫_a^b f(x)dx=F(b)−F(a)。'},
    {q:'部分積分の公式、置換積分の公式を述べよ。', a:'部分積分：∫f\'(x)g(x)dx=f(x)g(x)−∫f(x)g\'(x)dx。置換積分：∫_a^b f(g(x))g\'(x)dx=∫_{g(a)}^{g(b)} f(u)du。'},
    {q:'累次積分の定義とフビニの定理の主張を述べよ。', a:'累次積分∫_c^d(∫_a^b f(x,y)dx)dyのように1変数ずつ積分すること。フビニの定理：fが長方形[a,b]×[c,d]上で連続（あるいは可積分で適当な条件を満たす）ならば、重積分と両方の順序の累次積分はすべて一致する。'},
    {q:'有界集合上の積分の定義を述べよ。', a:'有界集合D上で定義されたfに対し、Dを含む長方形（区間）R上で特性関数χ_Dを用いた拡張f・χ_D（D外は0）を考え、この関数のR上でのリーマン積分として∫_D f を定義する。'},
    {q:'零集合（測度0の集合）の定義を述べよ。', a:'任意のε>0に対し、集合Aを覆う可算個の区間（またはn次元区間）の列でその長さ（体積）の総和がε未満にできるとき、Aは零集合（測度0）であるという。'},
    {q:'ルベーグの可積分条件を述べよ。', a:'有界関数fが有界閉区間上でリーマン可積分であることと、fの不連続点全体の集合が零集合であることは同値。'},
    {q:'極座標変換の公式とそのヤコビアンを述べよ。', a:'x=r cosθ, y=r sinθ。ヤコビアン|∂(x,y)/∂(r,θ)|=r。∬f(x,y)dxdy=∬f(rcosθ,rsinθ)・r drdθ。'},
    {q:'広義積分（1次元、非有界区間または非有界関数）の定義を述べよ。', a:'例えば∫_a^∞ f(x)dx = lim_{b→∞}∫_a^b f(x)dx（この極限が存在するとき収束するという）。非有界関数の場合も特異点に近づく極限として同様に定義する。'},
    {q:'Γ関数の定義とΓ(n+1)=n!を述べよ。', a:'Γ(s)=∫_0^∞ t^{s−1}e^{−t}dt (s>0)。部分積分によりΓ(s+1)=sΓ(s)が成り立ち、Γ(1)=1なので帰納的にΓ(n+1)=n!（n自然数）。'},
    {q:'B関数（ベータ関数）の定義とΓ関数との関係を述べよ。', a:'B(p,q)=∫_0^1 t^{p−1}(1−t)^{q−1}dt (p,q>0)。関係式：B(p,q)=Γ(p)Γ(q)/Γ(p+q)。'},
    {q:'関数列の一様収束の定義を述べよ。', a:'f_n→fが集合S上で一様収束とは、任意のε>0に対しあるNが存在し、n≥Nならばすべてのx∈Sで|f_n(x)−f(x)|<εとなること（Nがxによらず取れる点が各点収束との違い）。'},
    {q:'一様収束と項別積分・項別微分に関する定理を述べよ。', a:'f_nが[a,b]で連続かつfに一様収束すれば、lim∫f_n=∫f（項別積分可能）。また、f_n\'がgに一様収束し、あるx_0でf_n(x_0)が収束すれば、f_nはあるFに（各点かつ広義一様に）収束し、F\'=g（項別微分可能）。'},
    {q:'曲線の長さ（弧長）の定義を述べよ。', a:'パラメータ表示された曲線γ(t)=(x(t),y(t)) (a≤t≤b)に対し、分割の折れ線近似の長さの上限（またはリーマン和的極限）として弧長L=∫_a^b√(x\'(t)^2+y\'(t)^2)dtが定義される（γがC^1級のとき）。'},
    {q:'有界変動関数の定義とスチルチェス積分の定義を述べよ。', a:'関数gの変動V(g)=sup_Δ Σ|g(x_i)−g(x_{i−1})|が有限であるときgは有界変動という。スチルチェス積分∫f dg は、リーマン和Σf(ξ_i)(g(x_i)−g(x_{i−1}))の分割を細かくしたときの極限として定義される。'},
  ],
  level2:[
    {q:'ダルブーの判定条件を用いて連続関数fが[a,b]で可積分であることを証明せよ。', a:'fは[a,b]で連続なので一様連続。ε>0に対しδ>0を|x−y|<δ⟹|f(x)−f(y)|<ε/(b−a)となるよう取る。|Δ|<δとなる分割を取れば各小区間でM_i−m_i≤ε/(b−a)（一様連続性より小区間内での値の振れ幅が小さい）。よってU(Δ)−L(Δ)=Σ(M_i−m_i)Δx_i≤ε/(b−a)・Σ Δx_i=εとなり、ダルブーの条件を満たすので可積分。'},
    {q:'微積分学の基本定理（F(x)=∫_a^x f(t)dtのときF\'=f、fは連続）を証明せよ。', a:'(F(x+h)−F(x))/h = (1/h)∫_x^{x+h}f(t)dt。fの連続性からx付近でf(t)≈f(x)なので、|(1/h)∫_x^{x+h}f(t)dt − f(x)| = |(1/h)∫_x^{x+h}(f(t)−f(x))dt| ≤ sup_{t between x,x+h}|f(t)−f(x)| → 0 (h→0、連続性より)。よってF\'(x)=f(x)。'},
    {q:'Γ(n+1)=n! であることを部分積分を用いて証明せよ。', a:'Γ(s+1)=∫_0^∞ t^s e^{−t}dt。部分積分（u=t^s, dv=e^{−t}dt）：=[−t^s e^{−t}]_0^∞ + s∫_0^∞ t^{s−1}e^{−t}dt = 0 + sΓ(s)（境界項は0、s>0で発散なし）。よってΓ(s+1)=sΓ(s)。Γ(1)=∫_0^∞e^{−t}dt=1。帰納的にΓ(2)=1・Γ(1)=1=1!,Γ(3)=2Γ(2)=2=2!,…,Γ(n+1)=n・Γ(n)=n!。'},
    {q:'B(p,q)=Γ(p)Γ(q)/Γ(p+q) を導け（概略、2重積分と極座標変換を利用）。', a:'Γ(p)Γ(q)=∫_0^∞∫_0^∞ x^{p−1}y^{q−1}e^{−x−y}dxdy。x=u^2,y=v^2の変数変換や極座標(x=r^2cos^2θ,y=r^2sin^2θ的な変換)を用いると、この2重積分はΓ(p+q)とB(p,q)の積に分離でき、Γ(p)Γ(q)=Γ(p+q)B(p,q)が得られる（詳細計算は極座標変換：x=r^2cos^2θ, y=r^2sin^2θ、あるいはx+y=s, x=stの変数変換で実行）。'},
    {q:'広義積分∫_0^∞ e^{−x^2}dx=√π/2 を極座標変換を用いて求めよ（ガウス積分）。', a:'I=∫_0^∞e^{−x^2}dxとおく。I^2=∫_0^∞∫_0^∞e^{−(x^2+y^2)}dxdy。極座標変換x=rcosθ,y=rsinθ（第1象限は0≤θ≤π/2,0≤r<∞）でI^2=∫_0^{π/2}∫_0^∞ e^{−r^2}r dr dθ = (π/2)・[−(1/2)e^{−r^2}]_0^∞ = (π/2)(1/2)=π/4。よってI=√π/2。'},
    {q:'一様収束する連続関数列の極限関数は連続であることを証明せよ。', a:'f_n→f（一様、[a,b]上）、各f_nは連続とする。任意のε>0に対し、一様収束性からあるNで|f_N(x)−f(x)|<ε/3（すべてのx）。f_Nの連続性からあるδ>0で|x−a|<δ⟹|f_N(x)−f_N(a)|<ε/3。三角不等式より|f(x)−f(a)|≤|f(x)−f_N(x)|+|f_N(x)−f_N(a)|+|f_N(a)−f(a)|<ε/3+ε/3+ε/3=ε。よってfは連続。'},
    {q:'有界変動関数は2つの単調増加関数の差として表せること（ジョルダン分解）を示せ。', a:'gの[a,x]上の全変動をV(x)（正の変動）とし、P(x)=(V(x)+g(x)−g(a))/2、N(x)=(V(x)−g(x)+g(a))/2とおく。V(x)は単調増加（区間を広げれば変動は増加）であり、P,Nも単調増加であることが示せ、g(x)−g(a)=P(x)−N(x)、すなわちg(x)=g(a)+P(x)−N(x)は単調増加関数の差。'},
  ],
  level3:[
    {q:'f(x)=x^2sin(1/x) (x≠0), f(0)=0 は微分可能だがf\'は不連続であることを示せ（積分論との関連で、この不連続点での有界変動性も考えよ）。', a:'x≠0でf\'(x)=2xsin(1/x)−cos(1/x)。x=0では定義よりf\'(0)=lim h sin(1/h)=0（|hsin(1/h)|≤|h|→0）。x→0でf\'(x)は−cos(1/x)の振動のため極限を持たず不連続。一方、fは有界（|f(x)|≤x^2）かつ、x=0の近くで振動は激しいがf自体は連続で有界なので、有界変動性は個別の詳細評価が必要（f\'が有界（|f\'(x)|≤2|x|+1）であることから実際にはfは有界変動であることが示せる：微分が有界ならリプシッツ的評価により全変動は有限）。'},
    {q:'累次積分の順序交換ができない例を挙げ、フビニの定理が使えない理由を説明せよ。', a:'f(x,y)=(x^2−y^2)/(x^2+y^2)^2 on (0,1]×(0,1]（原点近くで非有界）を考えると、∫_0^1(∫_0^1 f dx)dy と ∫_0^1(∫_0^1 f dy)dx は符号が逆で値が異なることが知られる（それぞれπ/4, −π/4のような値）。原因は、fが原点近傍で有界でなく、絶対値の2重積分∬|f|dxdyが発散する（すなわち絶対可積分でない）ため、フビニの定理の仮定（有界性・可積分性）が満たされないから。'},
    {q:'リーマン関数（有理数p/q既約でf=1/q、無理数で0、f(0)=1などと定義）は[0,1]上可積分であり積分値は0であることを示せ。', a:'不連続点は有理数全体（可算集合）であり、可算集合は零集合である（各点を長さε/2^nの区間で覆えば総和ε）。ルベーグの可積分条件より、有界（0≤f≤1）かつ不連続点が零集合なのでfは可積分。下和はL(Δ)=0（どの小区間にも無理数があり下限は0）なので下積分=0。積分値は下積分=上積分=0（実際上積分も、任意のε>0に対しf≥εとなる点は有限個しかないことを用いてU(Δ)を小さくできる）。'},
    {q:'∫_0^∞ sin x/x dx の広義積分としての収束性を示せ（条件収束であることも述べよ）。', a:'x=0では sinx/x→1で特異性なし。∞への収束は部分積分：∫_1^N sinx/x dx=[−cosx/x]_1^N−∫_1^N cosx/x^2 dx。第一項はN→∞で収束（→cos1）、第二項は|cosx/x^2|≤1/x^2で絶対収束するため全体として収束する。しかし∫|sinx/x|dxは発散する（各周期で1/xのオーダーの下からの評価とΣ1/nの発散から）ので、条件収束である。'},
    {q:'Γ(1/2)=√π をB関数との関係とガウス積分から導け。', a:'B(1/2,1/2)=Γ(1/2)Γ(1/2)/Γ(1)=Γ(1/2)^2。一方B(1/2,1/2)=∫_0^1 t^{−1/2}(1−t)^{−1/2}dtは t=sin^2θ の置換で2∫_0^{π/2}dθ=πとなる。よってΓ(1/2)^2=πなのでΓ(1/2)=√π（Γ(1/2)>0より）。（別解としてΓ(1/2)=∫_0^∞t^{−1/2}e^{−t}dtにt=u^2を代入すると2∫_0^∞e^{−u^2}du=2・√π/2=√πとガウス積分から直接示せる。）'},
    {q:'各点収束するが一様収束しない関数列の例を挙げ、項別積分が成立する場合・しない場合を比較せよ。', a:'f_n(x)=x^n on [0,1]は各点でf(x)=0(0≤x<1), f(1)=1に収束するが、x=1近くでsup|f_n(x)−f(x)|=1（一様収束しない）。∫_0^1x^n dx=1/(n+1)→0=∫_0^1 f(x)dx（この場合は結果的に項別積分が成立）。一方g_n(x)=nx(1−x^2)^n on[0,1]は各点で0に収束するが、∫_0^1g_n(x)dx=n/(2(n+1))→1/2≠0=∫lim g_n。一様収束しない場合、項別積分が成立するとは限らないことを示す好例。'},
  ],
},
{
  id:'ch5', title:'第V章 級数',
  sections:['§1 上極限，下極限','§2 正項級数の収束判定条件','§3 絶対収束と条件収束','§4 アーベルの定理','§5 二重級数','§6 無限積'],
  level1:[
    {q:'正項級数の比較判定法を述べよ。', a:'0≤a_n≤b_n(十分大きいnで)のとき、Σb_nが収束すればΣa_nも収束し、Σa_nが発散すればΣb_nも発散する。'},
    {q:'ダランベールの判定法（比判定法）を述べよ。', a:'lim|a_{n+1}/a_n|=r とすると、r<1ならΣa_nは絶対収束、r>1なら発散（r=1のときは判定不能）。'},
    {q:'コーシーの判定法（根判定法）を述べよ。', a:'limsup|a_n|^{1/n}=r とすると、r<1ならΣa_nは絶対収束、r>1なら発散（r=1のときは判定不能）。'},
    {q:'積分判定法を述べよ。', a:'fが[1,∞)で正値かつ単調減少ならば、Σ_{n=1}^∞ f(n) と ∫_1^∞ f(x)dx は同時に収束するか同時に発散する。'},
    {q:'絶対収束・条件収束の定義を述べよ。', a:'Σ|a_n|が収束するとき絶対収束、Σa_nは収束するがΣ|a_n|は発散するとき条件収束という。'},
    {q:'ライプニッツの定理（交代級数の収束判定）を述べよ。', a:'a_n≥0が単調減少で a_n→0 ならば、交代級数Σ(−1)^{n−1}a_nは収束する。'},
    {q:'リーマンの級数定理の主張を述べよ。', a:'条件収束する実数級数は、項の順序を適当に並べ替えることで任意の実数（または±∞）に収束させることができる（絶対収束級数ではこのようなことは起こらない）。'},
    {q:'アーベルの定理を述べよ。', a:'べき級数f(x)=Σa_nx^nの収束半径がRで、x=Rで級数Σa_nR^nが収束するならば、fはx=Rで左側から連続、すなわちlim_{x→R^−}f(x)=Σa_nR^n。'},
    {q:'二重級数の収束の定義を述べよ。', a:'二重数列a_{mn}に対し、部分和S_{MN}=Σ_{m≤M,n≤N}a_{mn}がM,N→∞で(独立に)一定値に収束するとき収束するという。絶対収束（Σ|a_{mn}|が有界）すれば、和の取り方（行ごと・列ごと・対角線状等）によらず同じ値になる。'},
    {q:'無限積の収束の定義を述べよ。', a:'Π_{n=1}^∞(1+a_n)が収束するとは、部分積P_N=Π_{n=1}^N(1+a_n)がN→∞である0でない値に収束すること（多くの場合Σ|a_n|の収束が絶対収束の目安となる）。'},
    {q:'コーシー積（級数の積）の定義を述べよ。', a:'Σa_nとΣb_nのコーシー積はΣc_n（c_n=Σ_{k=0}^n a_k b_{n−k}）として定義される級数。両方が絶対収束すれば、コーシー積も収束しその和は(Σa_n)(Σb_n)に等しい。'},
    {q:'上極限・下極限の級数論での使われ方（コーシー・アダマールの公式の再確認）を述べよ。', a:'収束半径R=1/limsup|a_n|^{1/n}のように、収束・発散の境界を判定する場面でlimsup, liminfが本質的な役割を果たす。通常の極限が存在しない場合でも上極限・下極限は常に定義できる点が有用。'},
  ],
  level2:[
    {q:'ダランベールの判定法を証明せよ（収束の場合）。', a:'lim|a_{n+1}/a_n|=r<1とする。r<ρ<1となるρを取ると、あるNで n≥N ⟹ |a_{n+1}/a_n|<ρ。よってn≥Nで|a_n|<|a_N|ρ^{n−N}。Σρ^{n−N}は等比級数で収束するので比較判定法によりΣ|a_n|も収束（絶対収束）。'},
    {q:'ライプニッツの定理（交代級数の収束）を証明せよ。', a:'S_n=Σ_{k=1}^n(−1)^{k−1}a_kとする。S_{2n}は単調増加（S_{2n+2}−S_{2n}=a_{2n+1}−a_{2n+2}≥0）、S_{2n−1}は単調減少、かつS_{2n}≤S_{2n−1}(S_{2n−1}-S_{2n}=a_{2n}\geq0)なのでS_{2n}は上に有界、S_{2n-1}は下に有界。単調収束定理より両方収束し、S_{2n−1}−S_{2n}=a_{2n}→0なので同じ極限に収束、すなわちS_nは収束する。'},
    {q:'絶対収束級数は項の順序を変えても和が変わらないことを示せ（概略）。', a:'Σa_nが絶対収束し和がSとする。並べ替えた級数の部分和をT_Nとする。Nを十分大きく取れば、並べ替えの範囲は元の級数の最初のM項をすべて含むようにできる。|T_N−S_M|≤Σ(並べ替えに含まれる元のM項より後ろの項の絶対値)であり、これはΣ_{n>M}|a_n|以下で、絶対収束性からM→∞で0に収束する。よってT_N→Sとなり和は変わらない。'},
    {q:'アーベルの定理を証明せよ（概略、アーベルの総和法を用いる）。', a:'アーベルの部分和公式（総和法）を用いる。s_n=Σ_{k=0}^n a_k（x=Rでの部分和、収束すると仮定しs_n→S）とおく。f(x)=Σa_nx^n=(1−x/R)Σs_n(x/R)^n（アーベル変形、|x|<R）。x→R^−のとき、s_n→Sであることと(1−t)Σs_n t^n（t→1^−）の形の総和が、s_nの通常極限と一致すること（チェザロ平均的な議論）から、f(x)→Sが従う。'},

  {week:4, range:'第II章 §5〜§8（多変数実数値函数・多変数ベクトル値函数・テイラーの定理・最大最小と極値）＋模擬試験1', focus:'フレシェ微分・ヤコビ行列・ヘッセ行列による極値判定という院試頻出パターンを習得。',
   tasks:'週末に模擬試験1（第I〜II章）を90分で通し受験。できなかった問題は該当節の①に戻って復習。'},
  {week:5, range:'第III章 全体（複素変数函数の微分法・整級数・指数三角函数・対数逆三角函数）', focus:'べき級数の収束半径、オイラーの公式、初等関数の解析的取り扱いに集中。院試では計算問題として頻出。',
   tasks:'①②を全て、③は少なくとも半分は自力で解答。複素数の扱いに慣れていない場合は§4Rnと Cを復習しつつ進める。'},
  {week:6, range:'第IV章 §1〜§9（積分の意味・定義・可積分条件・連続函数の可積分性・一変数函数の積分・不定積分・累次積分・有界集合上の積分・零集合）', focus:'リーマン和・ダルブーの上下和という積分の「定義」を丁寧に。ここを飛ばして公式暗記に走らないこと。',
   tasks:'①を毎日反復、②の可積分性の証明とルベーグの可積分条件（零集合）は院試最頻出なので重点的に。'},
  {week:7, range:'第IV章 §10〜§17（極座標変換・広義積分・Γ函数とB函数・一様収束と項別微積分・径数を含む積分・Γ函数の性質・曲線の長さ・有界変動函数とスチルチェス積分）＋模擬試験2', focus:'ガウス積分・Γ/B関数・一様収束の3本柱を計算練習込みで固める。',
   tasks:'週末に模擬試験2（第III〜IV章）を90分で通し受験し自己採点。弱点は該当節の②③を再演。'},
  {week:8, range:'第V章 全体（上極限下極限・正項級数の収束判定・絶対収束条件収束・アーベルの定理・二重級数・無限積）＋全範囲総復習＋総合模擬試験', focus:'収束判定法の使い分けを一覧化して整理。最終週は全章横断で穴を埋める。',
   tasks:'前半4日で第V章を消化、後半3日で全5章の①を高速回転（1日1章ペース）、最終日に総合模擬試験（120分）を本番同様に実施。'},
];

/* ============ 状態管理 ============ */
const LS_PREFIX='sugiura_kaiseki_';
function getStatus(id){ return localStorage.getItem(LS_PREFIX+id) || ''; }
function setStatus(id, val){
  if(getStatus(id)===val){ localStorage.removeItem(LS_PREFIX+id); }
  else{ localStorage.setItem(LS_PREFIX+id, val); }
}
function getWeekDone(w){ return localStorage.getItem(LS_PREFIX+'week_'+w)==='1'; }
function toggleWeekDone(w){
  const k=LS_PREFIX+'week_'+w;
  if(localStorage.getItem(k)==='1') localStorage.removeItem(k); else localStorage.setItem(k,'1');
}
function resetAllProgress(){
  if(!confirm('全ての学習進捗をリセットします。よろしいですか？')) return;
  Object.keys(localStorage).filter(k=>k.startsWith(LS_PREFIX)).forEach(k=>localStorage.removeItem(k));
  render();
}

/* ============ ルーティング/描画 ============ */
let state={ view:'plan', chapterId:null, level:1, examId:null };

function navigate(view, extra){
  state.view=view;
  if(extra) Object.assign(state, extra);
  render();
}

function buildNav(){
  const nav=document.getElementById('navlist');
  const items=[
    {id:'plan', label:'📅 学習プラン'},
    ...CHAPTERS.map(c=>({id:'ch:'+c.id, label:c.title})),
    {id:'mock', label:'📝 模擬試験'},
    {id:'dash', label:'📊 進捗ダッシュボード'},
  ];
  nav.innerHTML='';
  items.forEach(it=>{
    const b=document.createElement('button');
    b.className='navbtn'+((state.view==='plan'&&it.id==='plan')||(state.view==='chapter'&&it.id==='ch:'+state.chapterId)||(state.view==='mock'&&it.id==='mock')||(state.view==='examdetail'&&it.id==='mock')||(state.view==='dash'&&it.id==='dash')?' active':'');
    b.textContent=it.label;
    b.onclick=()=>{
      if(it.id==='plan') navigate('plan');
      else if(it.id==='mock') navigate('mock');
      else if(it.id==='dash') navigate('dash');
      else navigate('chapter', {chapterId:it.id.slice(3), level:1});
    };
    nav.appendChild(b);
  });
}

function el(tag, attrs, children){
  const e=document.createElement(tag);
  if(attrs) Object.entries(attrs).forEach(([k,v])=>{
    if(k==='class') e.className=v;
    else if(k==='style') e.style.cssText=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k,v);
  });
  (children||[]).forEach(c=>{
    if(typeof c==='string') e.appendChild(document.createTextNode(c));
    else if(c) e.appendChild(c);
  });
  return e;
}

function renderPlan(){
  const main=document.getElementById('main');
  main.innerHTML='';
  main.appendChild(el('h2',{class:'pagetitle'},['2ヶ月学習プラン（全8週間）']));
  main.appendChild(el('div',{class:'note'},[
    '対象書籍：杉浦光夫『解析入門I』（基礎数学2、東京大学出版会）。全5章・43節を8週間で走破し、日本の主要大学院の数学系入試に対応できる習熟度を目指します。各週で ①定義・定理・用語の確認 → ②典型証明の反復 → ③発想問題（応用）の順で進めてください。1日の目安学習時間は90〜120分です。'
  ]));
  STUDY_PLAN_WEEKS.forEach(w=>{
    const card=el('div',{class:'weekcard'});
    const head=el('div',{class:'weekhead'},[
      el('b',{},['第'+w.week+'週　'+w.range]),
    ]);
    const cb=el('button',{class:'small'+(getWeekDone(w.week)?' ok active':' ok'), onclick:()=>{toggleWeekDone(w.week); renderPlan();}},[getWeekDone(w.week)?'✓ 完了':'未完了']);
    head.appendChild(cb);
    card.appendChild(head);
    card.appendChild(el('div',{style:'margin-top:8px;font-size:13.5px;'},['🎯 '+w.focus]));
    card.appendChild(el('div',{style:'margin-top:6px;font-size:13px;color:var(--text-dim);'},['📌 '+w.tasks]));
    main.appendChild(card);
  });
  main.appendChild(el('div',{class:'note'},[
    '補足：初学者の場合、第I章と第IV章前半（積分の定義）でつまずきやすいので、無理に先へ進まず該当週の日数を1〜2日増やし、その分第V章の後半（二重級数・無限積）を軽めに（①中心に）調整しても構いません。全体像を掴むことを優先してください。'
  ]));
}

function renderChapter(){
  const ch=CHAPTERS.find(c=>c.id===state.chapterId);
  const main=document.getElementById('main');
  main.innerHTML='';
  main.appendChild(el('h2',{class:'pagetitle'},[ch.title]));
  main.appendChild(el('div',{class:'sectionlist'},['収録節：'+ch.sections.join('　/　')]));

  const tabs=el('div',{class:'lvltabs'});
  [[1,'① 定義・定理・用語'],[2,'② 典型証明'],[3,'③ 発想問題（応用）']].forEach(([lvl,label])=>{
    const t=el('button',{class:'lvltab'+(state.level===lvl?' active':''), onclick:()=>{state.level=lvl; render();}},[label]);
    tabs.appendChild(t);
  });
  main.appendChild(tabs);

  const items = state.level===1?ch.level1:(state.level===2?ch.level2:ch.level3);
  const prefix = ch.id+'_L'+state.level+'_';
  let doneCnt=0, reviewCnt=0;
  items.forEach((it,i)=>{ const s=getStatus(prefix+i); if(s==='done')doneCnt++; if(s==='review')reviewCnt++; });
  const pct = items.length? Math.round(doneCnt/items.length*100):0;
  main.appendChild(el('div',{class:'progressbar'},[el('div',{style:'width:'+pct+'%'})]));
  main.appendChild(el('div',{class:'progress-label'},['理解済み '+doneCnt+' / 要復習 '+reviewCnt+' / 全'+items.length+'問　（'+pct+'%）']));

  items.forEach((it,i)=>{
    const id=prefix+i;
    const status=getStatus(id);
    const card=el('div',{class:'card'+(status==='done'?' done':status==='review'?' review':'')});
    card.appendChild(el('div',{class:'qlabel'},['Q'+(i+1)]));
    card.appendChild(el('div',{class:'qtext'},[it.q]));
    const ans=el('div',{class:'atext', id:'ans_'+ch.id+'_'+state.level+'_'+i},[it.a]);
    card.appendChild(ans);
    const row=el('div',{class:'btnrow'});
    row.appendChild(el('button',{class:'small primary', onclick:(e)=>{ ans.classList.toggle('show'); e.target.textContent=ans.classList.contains('show')?'解答を隠す':'解答を表示'; }},['解答を表示']));
    row.appendChild(el('button',{class:'small ok'+(status==='done'?' active':''), onclick:()=>{setStatus(id,'done'); render();}},['✓ 理解した']));
    row.appendChild(el('button',{class:'small warn'+(status==='review'?' active':''), onclick:()=>{setStatus(id,'review'); render();}},['△ 要復習']));
    card.appendChild(row);
    main.appendChild(card);
  });
}

function renderMockList(){
  const main=document.getElementById('main');
  main.innerHTML='';
  main.appendChild(el('h2',{class:'pagetitle'},['模擬試験']));
  main.appendChild(el('div',{class:'note'},['習熟度を測るための模擬試験です。範囲別に2回、全範囲を総合した院試レベルの模試を1回収録しています。時間を計って本番同様に取り組んでから解答を確認してください。']));
  MOCK_EXAMS.forEach(ex=>{
    const card=el('div',{class:'examcard', onclick:()=>navigate('examdetail',{examId:ex.id})});
    card.appendChild(el('h3',{},[ex.title]));
    card.appendChild(el('div',{style:'color:var(--text-dim);font-size:13px;'},[ex.time+'　/　全'+ex.problems.length+'問']));
    main.appendChild(card);
  });
}

function renderExamDetail(){
  const ex=MOCK_EXAMS.find(e=>e.id===state.examId);
  const main=document.getElementById('main');
  main.innerHTML='';
  main.appendChild(el('span',{class:'backlink', onclick:()=>navigate('mock')},['← 模擬試験一覧に戻る']));
  main.appendChild(el('h2',{class:'pagetitle'},[ex.title]));
  main.appendChild(el('div',{class:'progress-label'},[ex.time]));
  ex.problems.forEach((it,i)=>{
    const card=el('div',{class:'card'});
    card.appendChild(el('div',{class:'qlabel'},['第'+(i+1)+'問']));
    card.appendChild(el('div',{class:'qtext'},[it.q]));
    const ans=el('div',{class:'atext'},[it.a]);
    card.appendChild(ans);
    const row=el('div',{class:'btnrow'});
    row.appendChild(el('button',{class:'small primary', onclick:(e)=>{ ans.classList.toggle('show'); e.target.textContent=ans.classList.contains('show')?'解答を隠す':'解答を表示'; }},['解答を表示']));
    card.appendChild(row);
    main.appendChild(card);
  });
  const scoreKey=LS_PREFIX+'score_'+ex.id;
  const saved=localStorage.getItem(scoreKey)||'';
  const scoreBox=el('div',{class:'note'});
  scoreBox.appendChild(el('div',{},['自己採点を記録できます（'+ex.problems.length+'問中何問正解したか）：']));
  const input=el('input',{type:'number', min:'0', max:String(ex.problems.length), value:saved, style:'width:60px;margin:8px 6px;padding:4px 8px;background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:6px;'});
  const saveBtn=el('button',{class:'small primary', onclick:()=>{localStorage.setItem(scoreKey,input.value); alert('記録しました：'+input.value+' / '+ex.problems.length);}},['記録する']);
  scoreBox.appendChild(input);
  scoreBox.appendChild(document.createTextNode(' / '+ex.problems.length+'問　'));
  scoreBox.appendChild(saveBtn);
  main.appendChild(scoreBox);
}

function renderDash(){
  const main=document.getElementById('main');
  main.innerHTML='';
  main.appendChild(el('h2',{class:'pagetitle'},['進捗ダッシュボード']));
  CHAPTERS.forEach(ch=>{
    main.appendChild(el('h3',{style:'color:var(--accent2);margin-bottom:6px;'},[ch.title]));
    [[1,'① 定義・定理'],[2,'② 典型証明'],[3,'③ 発想問題']].forEach(([lvl,label])=>{
      const items = lvl===1?ch.level1:(lvl===2?ch.level2:ch.level3);
      const prefix=ch.id+'_L'+lvl+'_';
      let doneCnt=0;
      items.forEach((it,i)=>{ if(getStatus(prefix+i)==='done') doneCnt++; });
      const pct=items.length?Math.round(doneCnt/items.length*100):0;
      const row=el('div',{class:'dashrow'});
      row.appendChild(el('div',{},[label]));
      row.appendChild(el('div',{class:'progressbar'},[el('div',{style:'width:'+pct+'%'})]));
      row.appendChild(el('div',{},[pct+'%']));
      main.appendChild(row);
    });
  });
  main.appendChild(el('h3',{style:'color:var(--accent2);margin-top:20px;'},['模擬試験の自己採点履歴']));
  MOCK_EXAMS.forEach(ex=>{
    const saved=localStorage.getItem(LS_PREFIX+'score_'+ex.id);
    main.appendChild(el('div',{style:'font-size:13px;margin-bottom:6px;'},[ex.title+'：'+(saved!==null&&saved!==undefined&&saved!==''?saved+' / '+ex.problems.length+'問':'未受験')]));
  });
  main.appendChild(el('h3',{style:'color:var(--accent2);margin-top:20px;'},['学習プラン（週次）進捗']));
  const doneWeeks=STUDY_PLAN_WEEKS.filter(w=>getWeekDone(w.week)).length;
  main.appendChild(el('div',{style:'font-size:13px;'},['完了週：'+doneWeeks+' / '+STUDY_PLAN_WEEKS.length+'週']));
}

function render(){
  buildNav();
  if(state.view==='plan') renderPlan();
  else if(state.view==='chapter') renderChapter();
  else if(state.view==='mock') renderMockList();
  else if(state.view==='examdetail') renderExamDetail();
  else if(state.view==='dash') renderDash();
}

render();
</script>
